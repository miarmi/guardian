<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{t "del_title"}}{{t "title_sep"}}</title>
<meta name="theme-color" content="#1e6b64">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <p class="back"><a href="/situations">‹ {{t "sit_title"}}</a></p>
    <h1>{{t "del_title"}}</h1>
  </header>
  <p class="instruction">{{t "del_q" .S.Name}}</p>
  <div class="choices">
    <form method="post" action="/situations/{{.S.ID}}">
      <input type="hidden" name="delete" value="1">
      <input type="hidden" name="confirmed" value="1">
      <button type="submit" class="danger">{{t "sit_delete"}}</button>
    </form>
    <a class="button secondary" href="/situations#sit-{{.S.ID}}">{{t "del_keep"}}</a>
  </div>
</main>
<footer>{{t "version"}}: {{.Version}}</footer>
</body>
</html>
