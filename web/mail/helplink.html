<!doctype html>
<html><body style="margin:0;padding:24px;background:#f5f8f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1c2a31;font-size:16px;line-height:1.5">
<div style="max-width:560px;margin:0 auto"><div style="background:#1e6b64;color:#ffffff;border-radius:16px 16px 0 0;padding:18px 24px;font-size:20px;font-weight:700">Guardian</div><div style="background:#ffffff;border:1px solid #d6e0de;border-top:0;border-radius:0 0 16px 16px;padding:24px">
<p style="margin:0 0 8px;font-size:18px">{{.L.T "hello"}}</p>
<p style="margin:0 0 20px">{{.L.T "helplink_mail_intro"}}</p>
<p style="margin:0 0 8px"><a href="{{.Link}}" style="display:inline-block;background:#1e6b64;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px">{{.L.T "hl_button"}}</a></p>
<p style="margin:0 0 24px;color:#56666d">{{.L.T "helplink_valid" .Until}}</p>
<div style="background:#ddeeea;border-radius:12px;padding:16px;color:#1c2a31">
{{range $i, $c := .Contacts}}{{if eq $i 0}}<p style="margin:0 0 6px;font-weight:700">{{$c}}</p>{{else}}<p style="margin:0 0 6px">{{linkify $c}}</p>{{end}}{{end}}
</div>
</div>
</div>
</body></html>
