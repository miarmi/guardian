<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect WhatsApp – Guardian</title>
<meta name="theme-color" content="#3b4a8a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <p class="back"><a href="/">‹ Guardian</a></p>
    <h1>Connect WhatsApp</h1>
  </header>

  <p class="instruction{{if .Error}} dim{{end}}" id="instruction">Open WhatsApp on the phone, go to Linked devices, and scan this code.</p>

  <div class="qr{{if .HasQR}} has-code{{end}}" id="qr" data-state="{{.State}}"{{if .Error}} data-error="1"{{end}}>
    <img id="qr-image" src="/whatsapp/qr.png" alt="QR code to scan in WhatsApp" width="288" height="288"{{if not .HasQR}} hidden{{end}}>
    <div id="qr-status" class="qr-status" role="status" aria-live="polite">
      <p id="qr-message">{{if .Error}}{{.Error}}{{else if .HasQR}}{{else}}Getting a code…{{end}}</p>
      <form method="post" action="/whatsapp/connect" id="retry"{{if not .Error}} hidden{{end}}>
        <button type="submit">Try again</button>
      </form>
    </div>
    <p id="countdown" class="countdown" hidden></p>
  </div>

  <p class="hint">The phone will show a linked device named <strong>Guardian</strong>. It can be removed there at any time.</p>
</main>
<footer>Version: {{.Version}}</footer>
<script src="/static/connect.js"></script>
</body>
</html>
